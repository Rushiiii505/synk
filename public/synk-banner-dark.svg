    </text>
  </g>

  <defs>
    <linearGradient id="bannerSynkGrad" x1="100" y1="75" x2="140" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3E635"/>
      <stop offset="0.5" stop-color="#84CC16"/>
      <stop offset="1" stop-color="#65A30D"/>
    </linearGradient>
  </defs>
