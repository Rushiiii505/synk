    </text>
  </g>

  <g transform="translate(560, 110)">
    <rect width="160" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="14" y="18" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#A3E635">
