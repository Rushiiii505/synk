<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card with Soft Border -->
  <rect width="800" height="200" rx="24" fill="#0A0D14"/>
  <rect x="0.5" y="0.5" width="799" height="199" rx="23.5" stroke="#1E293B"/>

  <!-- Ambient Glow Gradients -->
  <circle cx="120" cy="100" r="80" fill="#84CC16" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="680" cy="100" r="80" fill="#A855F7" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Centered Synk Logo Icon Glyph -->
  <rect x="80" y="60" width="80" height="80" rx="22" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
  
  <path
    d="M130 86C130 82.6863 127.314 80 124 80H112C107.029 80 103 84.0294 103 89C103 93.9706 107.029 98 112 98H128C132.971 98 137 102.029 137 107C137 111.971 132.971 116 128 116H116C112.686 116 110 113.314 110 110"
    stroke="url(#bannerSynkGrad)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="130" cy="86" r="4.5" fill="#A3E635"/>
  <circle cx="110" cy="110" r="4.5" fill="#84CC16"/>
  <circle cx="120" cy="98" r="3" fill="#FFFFFF"/>

  <!-- Brand Title Typography -->
  <text x="180" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="-2px" fill="#FFFFFF">
    synk
  </text>
  <circle cx="308" cy="84" r="5" fill="#84CC16"/>

  <!-- Tagline -->
  <text x="182" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="0.5px">
    COLLABORATIVE SPRINTS • TEAM STICKY NOTES • TREASURY CASHFLOW IN ₹
  </text>

  <!-- Right Pill Badges -->
  <g transform="translate(560, 75)">
    <rect width="160" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
    <circle cx="16" cy="14" r="4" fill="#84CC16"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">
